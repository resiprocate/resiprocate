name: Linux-CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with ${{ matrix.c-compiler }}
    runs-on: ubuntu-22.04
    container:
      image: debian:bullseye-slim
      options: --ulimit memlock=-1
    strategy:
      fail-fast: false
      matrix:
        c-compiler: [gcc-10, clang-13]
        include:
          - c-compiler: gcc-10
            cxx-compiler: g++-10
          - c-compiler: clang-13
            cxx-compiler: clang++-13
    env:
      CC: /usr/bin/${{ matrix.c-compiler }}
      CXX: /usr/bin/${{ matrix.cxx-compiler }}
    steps:
      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v1.1.0
        id: cpu-cores

      - name: Install Dependencies
        run: |
          # Adding the debify repository is not optional: it is the only source
          # of libsipxtapi-dev 3.3.0~test20-2.  Debian bullseye itself only has
          # 3.3.0~test18, whose -dev package omits headers recon needs, and the
          # fallback is silent - configure still succeeds and the build dies
          # ~86% in.  Fetching the script to a file rather than piping it into
          # a shell means a failed download fails this step; a pipeline reports
          # only the shell's exit status, and an empty script exits 0.  What
          # actually got installed is checked in the step after this one.
          apt-get update -qq
          apt-get install -qq wget
          wget -O /tmp/add-apt-debify http://apt.debify.org/add-apt-debify
          bash /tmp/add-apt-debify
          rm -f /tmp/add-apt-debify
          apt-get update -qq
          PACKAGES=" \
            clang-13 \
            clang-tidy-13 \
            cmake \
            default-libmysqlclient-dev \
            g++-10 \
            git \
            gperf \
            libasio-dev \
            libboost-all-dev \
            libc-ares-dev \
            libcppunit-dev \
            libdb++-dev \
            libfmt-dev \
            libgeoip-dev \
            libgloox-dev \
            libgstreamermm-1.0-dev \
            libpopt-dev \
            libpq-dev \
            postgresql-server-dev-all \
            libqpid-proton-cpp12-dev \
            libradcli-dev \
            libsipxtapi-dev \
            libsnmp-dev \
            libsoci-dev \
            libsrtp2-dev \
            libssl-dev \
            libtelepathy-qt5-dev \
            libwebsocketpp-dev \
            libxerces-c-dev \
            lld-13 \
            make \
            perl \
            python3-cxx-dev \
            python3-dev \
            sox \
            xxd"
          # deb.debian.org resets connections mid-download often enough to red
          # a run on its own ("Error reading from server ... 104"), and one bad
          # .deb fails the whole job.  Retry the install a few times, refreshing
          # the lists in between; $PACKAGES is deliberately unquoted so it word
          # splits into arguments.
          attempt=1
          until apt-get install -qq $PACKAGES
          do
            if [ "$attempt" -ge 3 ]
            then
              echo "::error::apt-get install failed $attempt times"
              exit 1
            fi
            echo "apt-get install failed, retrying (attempt $attempt)"
            attempt=$((attempt + 1))
            sleep 10
            apt-get update -qq
          done

      - name: Verify sipXtapi headers
        run: |
          apt-cache policy libsipxtapi-dev
          # recon includes CpTopologyGraphFactoryImpl.h, which upstream only
          # moved from noinst_HEADERS to nobase_include_HEADERS in Nov 2025.
          # It is present in the debify build and absent from Debian's older
          # one, so its absence means we got the wrong libsipxtapi-dev.
          if [ ! -f /usr/include/sipxtapi/CpTopologyGraphFactoryImpl.h ]
          then
            echo "::error::libsipxtapi-dev does not provide CpTopologyGraphFactoryImpl.h - the debify repository was probably not used.  recon cannot build against this package."
            dpkg -L libsipxtapi-dev | grep -i cptopology || true
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v3

      - name: Upgrade CMake
        run: ./build/travis/upgradecmake

      - name: Bootstrap
        run: ./build/travis/bootstrap

      - name: Configure
        run: ./build/travis/configure

      - name: Build
        run: ./build/travis/build

      - name: Analyse
        if: ${{ matrix.c-compiler == 'clang-13' }}
        run: run-clang-tidy-13 -j ${{ steps.cpu-cores.outputs.count }} -quiet

      - name: Test
        run: make -j1 CTEST_OUTPUT_ON_FAILURE=1 test
